name: Tests

# Runs directly on pull requests, and as a reusable workflow called by the
# publish and deploy pipelines — those two used to build and ship without
# running anything, so a red test could reach production unnoticed.
#
# Deliberately no `push` trigger: pushes to main run docker.yml and pushes to
# release run fly-deploy.yml, both of which call this workflow. Adding one here
# would run the whole suite twice for every push.
on:
  pull_request:
  workflow_call:

jobs:
  # Gates only on findings a change introduces, not on the whole tree. The
  # repository has a pre-existing backlog (255 findings when golangci-lint was
  # first run uncapped against it; 10 remain), and a full-tree gate would fail
  # every PR regardless of what it touched. Clear the backlog and this can
  # become `make lint`.
  #
  # What is left is not mechanical: two duplicated provider fan-outs, two
  # functions over the complexity threshold, and six by-value parameters where
  # value semantics are deliberate. Each needs a design decision rather than an
  # edit, which is why they are still here.
  #
  # pull_request only: --new-from-rev needs a base commit to diff against, and
  # it is read from the pull_request event payload, which the workflow_call path
  # (invoked from publish and deploy) does not have.
  lint:
    name: Lint changed code
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # --new-from-rev diffs against the base branch, so the shallow clone
          # checkout defaults to is not enough history to compute it.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Installed from source rather than via golangci/golangci-lint-action:
      # fewer third-party actions running in a job that holds a repository token. The
      # version is pinned so CI cannot start failing because upstream enabled a
      # new check — bump it deliberately.
      #
      # Moved off v2.12.2 with the Go 1.27 bump. That release vendors
      # honnef.co/go/tools v0.7.0, whose IR builder cannot handle the 1.27
      # standard library: it panics with `buildir: unexpected expr:
      # *ast.KeyValueExpr` on package "poll", which takes goanalysis_metalinter
      # down with it. The job dies without reporting a single finding, so the
      # gate silently stops gating rather than failing loudly.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      # Diffed against the base commit by SHA rather than by branch name. The
      # name would have to be fetched, and persist-credentials: false above
      # means a later `git fetch` has no token to authenticate with — it fails
      # with "could not read Username for https://github.com". The SHA needs no
      # fetch: fetch-depth: 0 on a pull_request checks out the merge commit,
      # whose history already contains the base tip.
      #
      # The issue caps are disabled for the same reason as in the Makefile:
      # golangci-lint reports at most 50 per linter and 3 per identical message
      # by default, which on a gate means a PR can pass having been told about
      # only some of what it introduced.
      #
      # The base commit reaches the shell as an environment variable rather than
      # by expanding ${{ }} inside the command. GitHub substitutes those before
      # bash ever sees the line, so an expression carrying shell metacharacters
      # becomes part of the script itself. A commit SHA cannot, but the safe
      # form costs nothing and does not have to be revisited if this ever goes
      # back to interpolating a branch name, which can.
      - name: golangci-lint (new findings only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >
          golangci-lint run --timeout 10m
          --max-issues-per-linter=0 --max-same-issues=0
          --new-from-rev="${BASE_SHA}" ./...

  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    # Nothing here writes anything: it reads the repo and runs tests.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # checkout leaves GITHUB_TOKEN in .git/config by default, where any
          # later step — including third-party actions — can read it. Nothing
          # in this job talks to the remote, so it is not needed.
          persist-credentials: false

      # Workflow files are only executed by GitHub, so a typo in `needs:` or a
      # broken reusable-workflow reference would otherwise be discovered by the
      # gate silently not gating. actionlint also runs shellcheck over `run:`
      # blocks and validates ${{ }} expressions.
      #
      # Pinned to a commit rather than the floating v2 tag: a tag can be moved,
      # and this action runs with access to the workflow token. SHA verified
      # against the v2.2.0 release via the GitHub API.
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is clean
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests (race detector)
        run: go test -race -count=1 ./...

      - name: Integration tests (race detector)
        run: go test -tags integration -race -count=1 .
