# Deploys on a release tag. `make release V=vX.Y.Z` pushes the tag, and that push
# is the deploy — there is no release branch and no second PR.
#
# The version baked into the binary is the tag name itself, so it cannot drift
# from what was tagged. (The previous flow read it with `git describe` on a
# release branch, which walked back to the wrong tag whenever that branch was
# squash- or rebase-merged.)
#
# Rollback is redeploying an earlier tag: Actions → Fly Deploy → Run workflow →
# tag. The checkout is verified to sit exactly on a release tag before anything
# runs, so a typo in that box fails fast rather than deploying a random commit.

name: Fly Deploy
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)deploy, e.g. v0.72.0'
        required: true
        type: string

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  deploy:
    name: Deploy app
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-group
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-tags: true
          persist-credentials: false
      - name: Confirm this is exactly a release tag
        run: |
          tag="$(git describe --tags --exact-match)"
          case "$tag" in
            v*) echo "deploying $tag" ;;
            *)  echo "::error::$tag is not a release tag"; exit 1 ;;
          esac
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --build-arg VERSION=${{ inputs.tag || github.ref_name }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
