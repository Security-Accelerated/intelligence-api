name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Publishing an image that fails its own tests helps nobody. This gate is why
  # test.yml is reusable rather than a standalone workflow.
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The build reads files from the working tree; GHCR auth is handled
          # by docker/login-action below, so the git token is not needed after
          # checkout and should not be left in .git/config.
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The gha cache exporter below needs the docker-container driver; the
      # runner's default docker driver cannot export cache.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Layers are cached in the repository's Actions cache between builds, so
      # the apk and go mod download steps are restored rather than rerun.
      # mode=max includes the intermediate build stage, which the default
      # (final image layers only) would drop for a multi-stage Dockerfile. The
      # go build layer is cacheable in principle but never hits here: a push to
      # main changes the source under COPY . ., and a tag changes VERSION, so in
      # practice it reruns on every build.
      #
      # ignore-error: the cache is an optimization, and a failed export must
      # not fail a job whose purpose is publishing the image. The Actions cache
      # API rate-limits and has outages; without this the image would push and
      # the job would then go red for a cache write. A failed export just means
      # the next build is cold, and buildx still logs a warning.
      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
