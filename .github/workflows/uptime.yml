name: Uptime Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # allow manual trigger for testing

jobs:
  check:
    name: Health check
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        id: ping
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://api.securityaccelerated.com/v1/health)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != "200" ]; then
            echo "Health check failed with status $status"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST https://api.pushover.net/1/messages.json \
            -d "token=${{ secrets.PUSHOVER_API_TOKEN }}" \
            -d "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            -d "title=API Down" \
            -d "message=api.securityaccelerated.com health check failed (HTTP ${{ steps.ping.outputs.status }})" \
            -d "priority=1" \
            -d "sound=siren"
