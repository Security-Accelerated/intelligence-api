services:
  api:
    image: intelligence-api
    container_name: intelligence-api
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    ports:
      - "8080:8080"
      # The metrics listener, for curl and the smoke test. Loopback only: the
      # endpoint is unauthenticated, and Prometheus reaches it over the compose
      # network without this.
      - "127.0.0.1:9091:9091"
    environment:
      POSTGRES_SSLMODE: disable
      METRICS_ENABLED: "true"
    volumes:
      - /etc/security-accelerated/intelligence-api.yaml:/etc/security-accelerated/intelligence-api.yaml:ro
      # The app downloads the GeoIP database on first boot (no key needed) and
      # persists it here (gitignored), so local dev matches production.
      - ./data/geoip:/data/geoip
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intelligence
      POSTGRES_PASSWORD: intelligence
      POSTGRES_DB: intelligence_api
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelligence -d intelligence_api"]
      interval: 2s
      timeout: 3s
      retries: 10
  # Prometheus and Grafana, so the dashboard in deploy/grafana can be checked
  # against real series before a release. Development only: production is
  # scraped by Fly (see docs/operations.md). Both are published on loopback.
  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # No login on a loopback-only dev instance. Editor is enough to change a
      # panel and export the result; nothing here is ever reachable off-host.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/intelligence-api.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/intelligence-api.json:/var/lib/grafana/dashboards/intelligence-api.json:ro
    depends_on:
      - prometheus

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
