---

application:
  mode: local
  port: 8080

server:
  read_timeout: 10s
  write_timeout: 45s
  idle_timeout: 60s
  shutdown_timeout: 15s
  body_limit: 1048576  # 1 MB

gin:
  mode: debug

redis:
  addr: redis:6379
  password: ""
  db: 0
  cache_ttl: 60m

auth:
  cache_ttl: 5m

domain:
  lookup_timeout: 30s
  max_domains:
    free: 1
    basic: 5
    pro: 20

screenshot:
  timeout: 15s
  max_png_bytes: 5242880  # 5 MB

subdomain:
  max_results: 500
  max_response_bytes: 10485760  # 10 MB

ct_logs:
  max_entries: 100

rate_limit:
  free: 5
  basic: 30
  pro: 120

pushover:
  api_token: ""
  user_key: ""

alerts:
  throttle_threshold: 5
  throttle_window: 5m
  spike_threshold: 15
  spike_window: 5m
  cooldown: 15m
  max_concurrent_sends: 5
  max_window_size: 1000

stripe:
  secret_key: ""
  webhook_secret: ""
  prices:
    basic_monthly: ""
    pro_monthly: ""
  payment_link:
    basic: ""
    pro: ""
  portal_link: ""

billing:
  stale_key_days: 365

usage:
  buffer_size: 256
  flush_interval: 5s

threat_intel:
  virustotal_api_key: ""
  alienvault_api_key: ""

postgres:
  host: postgres
  port: 5432
  user: intelligence
  password: intelligence
  dbname: intelligence_api
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m
  conn_max_idle_time: 2m
