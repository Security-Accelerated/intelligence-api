---

application:
  mode: local
  port: 8080

server:
  read_timeout: 10s
  write_timeout: 45s
  idle_timeout: 60s
  shutdown_timeout: 15s
  body_limit: 1048576  # 1 MB

gin:
  mode: debug

redis:
  addr: redis:6379
  password: ""
  db: 0

# Domain lookup results are cached per lookup under `lookup:<domain>:<name>`,
# so each lookup expires on its own schedule. Anything not listed under `ttl`
# falls back to `default_ttl`. Override individually with env vars, e.g.
# CACHE_TTL_WHOIS=48h or CACHE_DEFAULT_TTL=30m.
# `fingerprint` has no entry: it is computed from headers data rather than
# fetched, so caching `headers` already caches it.
cache:
  default_ttl: 60m
  ttl:
    whois: 24h
    ct_logs: 24h
    subdomains: 24h
    bgp: 24h
    ssl: 4h
    email_security: 4h
    dns: 30m
    headers: 30m
    reputation: 30m
    threat_intel: 30m
    screenshot: 60m
    # IP lookups. geo and asn are absent deliberately: they read a local MaxMind
    # mmap and are never cached, so a TTL would be meaningless.
    reverse_dns: 6h
    abuse_contact: 24h

auth:
  cache_ttl: 5m
  rotation_grace: 24h   # how long old keys keep working after /v1/keys/rotate
  last_used_buffer_size: 256
  last_used_flush_interval: 10s

domain:
  lookup_timeout: 30s
  max_domains:
    free: 1
    pro: 20

screenshot:
  timeout: 15s
  max_png_bytes: 5242880  # 5 MB
  max_concurrent: 4       # global cap on concurrent Chromium processes

subdomain:
  max_results: 500
  max_response_bytes: 10485760  # 10 MB
  http_timeout: 15s             # end-to-end crt.sh request cap
  max_domains:
    free: 1
    pro: 5

ct_logs:
  max_entries: 100
  http_timeout: 15s   # end-to-end crt.sh request cap

rate_limit:
  free: 5
  pro: 120

pushover:
  api_token: ""
  user_key: ""

alerts:
  throttle_threshold: 5
  throttle_window: 5m
  spike_threshold: 15
  spike_window: 5m
  cooldown: 15m
  max_concurrent_sends: 5
  max_window_size: 1000

stripe:
  secret_key: ""
  webhook_secret: ""
  prices:
    pro_monthly: ""
  payment_link:
    pro: ""
  portal_link: ""

billing:
  stale_key_days: 365
  cleanup_interval: 10m   # sweep cadence for expired provisioned keys

usage:
  buffer_size: 256
  flush_interval: 5s

# External DNS resolvers (empty = Google, Cloudflare, OpenDNS defaults)
# dns:
#   servers:
#     - "8.8.8.8:53"
#     - "1.1.1.1:53"
#     - "208.67.222.222:53"

ip:
  lookup_timeout: 30s
  max_ips:
    free: 1
    pro: 20

maxmind:
  license_key: ""
  db_path: "/data/maxmind"
  city_db: "GeoLite2-City.mmdb"
  asn_db: "GeoLite2-ASN.mmdb"
  # Databases older than this are re-downloaded in the background at startup.
  # MaxMind publishes GeoLite2 updates twice a week. 0 disables the check.
  max_age: "168h"

threat_intel:
  virustotal_api_key: ""
  alienvault_api_key: ""

# CDN in front of the origin. The app also answers on its platform hostname, so
# a caller who finds that address bypasses the edge WAF entirely; the CDN adds
# origin_secret_header to everything it proxies and the origin rejects requests
# without it.
#
# Order matters at cutover. Set origin_secret first and confirm the header is
# arriving, then turn on require_origin_secret and switch client_ip_header in
# the same change — trusting an edge-set header while the origin is still open
# lets anyone forge their own IP into the logs, so that combination refuses to
# start.
edge:
  origin_secret: ""
  origin_secret_header: "X-Origin-Secret"
  require_origin_secret: false
  # "CF-Connecting-IP" once proxied through Cloudflare.
  client_ip_header: "Fly-Client-IP"

postgres:
  host: postgres
  port: 5432
  user: intelligence
  password: intelligence
  dbname: intelligence_api
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m
  conn_max_idle_time: 2m
