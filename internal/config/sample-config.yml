---

application:
  mode: local
  port: 8080

server:
  read_timeout: 10s
  write_timeout: 45s
  idle_timeout: 60s
  shutdown_timeout: 15s
  body_limit: 1048576  # 1 MB

gin:
  mode: debug

redis:
  addr: redis:6379
  password: ""
  db: 0

# Domain lookup results are cached per lookup under `lookup:<domain>:<name>`,
# so each lookup expires on its own schedule. Anything not listed under `ttl`
# falls back to `default_ttl`. Override individually with env vars, e.g.
# CACHE_TTL_WHOIS=48h or CACHE_DEFAULT_TTL=30m.
# `fingerprint` has no entry: it is computed from headers data rather than
# fetched, so caching `headers` already caches it.
cache:
  default_ttl: 60m
  ttl:
    whois: 24h
    ct_logs: 24h
    subdomains: 24h
    bgp: 24h
    ssl: 4h
    email_security: 4h
    dns: 30m
    headers: 30m
    reputation: 30m
    threat_intel: 30m
    # IP lookups. geo is absent deliberately: it reads a local mmap and is
    # never cached, so a TTL would be meaningless.
    asn: 24h
    reverse_dns: 6h
    abuse_contact: 24h

auth:
  cache_ttl: 5m
  rotation_grace: 24h   # how long old keys keep working after /v1/keys/rotate
  last_used_buffer_size: 256
  last_used_flush_interval: 10s

domain:
  lookup_timeout: 30s
  max_domains:
    free: 1
    pro: 20

subdomain:
  max_results: 500
  max_response_bytes: 10485760  # 10 MB
  http_timeout: 15s             # end-to-end crt.sh request cap
  max_domains:
    free: 1
    pro: 5

ct_logs:
  max_entries: 100
  http_timeout: 15s   # end-to-end crt.sh request cap

rate_limit:
  free: 5
  pro: 120

pushover:
  api_token: ""
  user_key: ""

alerts:
  throttle_threshold: 5
  throttle_window: 5m
  spike_threshold: 15
  spike_window: 5m
  cooldown: 15m
  max_concurrent_sends: 5
  max_window_size: 1000

stripe:
  secret_key: ""
  webhook_secret: ""
  prices:
    pro_monthly: ""
  payment_link:
    pro: ""
  price_display:
    pro: ""           # shown on the docs Plans table, e.g. "$29/month"; keep in step with prices.pro_monthly
  portal_link: ""

billing:
  stale_key_days: 365
  cleanup_interval: 10m   # sweep cadence for expired provisioned keys

usage:
  buffer_size: 256
  flush_interval: 5s

# External DNS resolvers (empty = Google, Cloudflare, OpenDNS defaults)
# dns:
#   servers:
#     - "8.8.8.8:53"
#     - "1.1.1.1:53"
#     - "208.67.222.222:53"

ip:
  lookup_timeout: 30s
  max_ips:
    free: 1
    pro: 20

# DB-IP Lite City (CC BY 4.0), downloaded in the background when missing or
# stale. No key needed. The asn lookup uses Team Cymru DNS and needs no file.
geoip:
  db_path: "/data/geoip"
  city_db: "dbip-city-lite.mmdb"
  # A database older than this is re-downloaded in the background at startup.
  # DB-IP publishes Lite releases monthly. 0 disables the check.
  max_age: "720h"

threat_intel:
  virustotal_api_key: ""
  alienvault_api_key: ""

postgres:
  host: postgres
  port: 5432
  user: intelligence
  password: intelligence
  dbname: intelligence_api
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m
  conn_max_idle_time: 2m
