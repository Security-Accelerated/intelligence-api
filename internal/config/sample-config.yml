---

application:
  mode: local
  port: 8080

gin:
  mode: debug

redis:
  addr: redis:6379
  password: ""
  db: 0
  cache_ttl: 60m

auth:
  cache_ttl: 5m

domain:
  max_domains:
    basic: 5
    premium: 20

screenshot:
  timeout: 15s

typosquatting:
  timeout: 30s
  max_permutations: 500
  concurrency: 20
  max_domains:
    basic: 3
    premium: 5

subdomain:
  max_results: 500

rate_limit:
  basic: 30
  premium: 120

postgres:
  host: postgres
  port: 5432
  user: intelligence
  password: intelligence
  dbname: intelligence_api
  sslmode: disable
