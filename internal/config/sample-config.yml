---

application:
  mode: local
  port: 8080

gin:
  mode: debug

redis:
  addr: redis:6379
  password: ""
  db: 0
  cache_ttl: 60m

auth:
  cache_ttl: 5m

domain:
  max_domains:
    basic: 5
    pro: 20

screenshot:
  timeout: 15s

subdomain:
  max_results: 500

ct_logs:
  max_entries: 100

rate_limit:
  basic: 30
  pro: 120

pushover:
  api_token: ""
  user_key: ""

alerts:
  throttle_threshold: 5
  throttle_window: 5m
  spike_threshold: 15
  spike_window: 5m
  cooldown: 15m

postgres:
  host: postgres
  port: 5432
  user: intelligence
  password: intelligence
  dbname: intelligence_api
  sslmode: disable
