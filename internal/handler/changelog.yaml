# Changelog — Intelligence API
# audience: public (shown on docs page), internal (admin/ops only)

- version: v0.49.1
  date: 2026-04-04
  changes:
    - text: "Session IDs redacted from billing logs to prevent token leakage"
      audience: internal
    - text: "Upstream provider requests (crt.sh, RDAP, threat intel) now verify TLS certificates"
      audience: internal
    - text: "Response header size capped at 1 MB to prevent memory pressure from malicious servers"
      audience: internal
    - text: "Client IP detection uses Fly-Client-IP header in production to prevent X-Forwarded-For spoofing"
      audience: internal

- version: v0.49.0
  date: 2026-04-04
  changes:
    - text: "Switched PostgreSQL driver from lib/pq to pgx with simple protocol mode — eliminates prepared statement errors on Neon"
      audience: internal
    - text: "DSN construction uses net/url for proper percent-encoding of credentials"
      audience: internal

- version: v0.48.0
  date: 2026-04-04
  changes:
    - text: "Checkout success page no longer hardcodes plan name"
      audience: internal
    - text: "README, api.http, sales slick, and CLAUDE.md synced with current route surface and config"
      audience: internal

- version: v0.47.0
  date: 2026-04-04
  changes:
    - text: "Routine upstream lookup failures (DNS, WHOIS, TLS) no longer trigger Pushover alerts"
      audience: internal
    - text: "Usage batch flush uses transaction + prepared statement to avoid Neon prepared statement invalidation"
      audience: internal

- version: v0.46.0
  date: 2026-04-04
  changes:
    - text: "Auth middleware rejects inactive accounts as defense-in-depth"
      audience: internal
    - text: "Billing checkout flow fully unit-tested (9 test cases covering idempotency, validation, and error paths)"
      audience: internal
    - text: "Docs changelog filtering and data injection tested (internal entries, version, payment links)"
      audience: internal
    - text: "Billing route integration tests added (webhook and success page wiring)"
      audience: internal

- version: v0.45.0
  date: 2026-04-04
  changes:
    - text: "Reverse DNS lookups gracefully handle missing PTR records instead of logging warnings"
      audience: internal

- version: v0.44.0
  date: 2026-04-03
  changes:
    - text: "DNS lookups now use external resolvers (Google, Cloudflare, OpenDNS) with automatic fallback"
      audience: public
    - text: "RDAP abuse contact queries go directly to regional RIR endpoints instead of rdap.org bootstrap"
      audience: internal
    - text: "Global RDAP rate limiter (10 req/s) prevents upstream abuse under load"
      audience: internal
    - text: "RIR endpoint routing by IP range (ARIN, RIPE, APNIC, LACNIC, AFRINIC)"
      audience: internal
    - text: "DNS resolver initializes after DB/Redis connections to preserve platform hostname resolution"
      audience: internal
    - text: "Docs pages redesigned with new visual theme"
      audience: internal

- version: v0.42.0
  date: 2026-04-01
  changes:
    - text: "Fixed SQL operator precedence bug in stale account deactivation"
      audience: internal
    - text: "Stripe checkout handler validates session fields to prevent panics on malformed webhooks"
      audience: internal
    - text: "Reputation and threat intelligence provider errors are now sanitized before reaching API responses"
      audience: internal
    - text: "Fingerprint update errors distinguish validation (400) from database failures (500)"
      audience: internal
    - text: "Template rendering errors are now logged instead of silently discarded"
      audience: internal
    - text: "WHOIS lookup handles missing registrar/domain data without panicking"
      audience: internal

- version: v0.41.0
  date: 2026-03-29
  changes:
    - text: "New endpoint: POST /v1/ip/lookup — GeoIP, ASN, reverse DNS, abuse contact, and threat intelligence for IP addresses"
      audience: public
    - text: "IP threat intelligence requires a pro plan (same as domain threat_intel)"
      audience: public
    - text: "GeoIP and ASN data powered by MaxMind GeoLite2 databases (loaded from disk, refreshable via admin endpoint)"
      audience: public
    - text: "Admin endpoint POST /v1/admin/geoip/refresh for hot-reloading MaxMind databases"
      audience: internal
    - text: "Abuse contact lookup uses RDAP (structured JSON) instead of raw WHOIS parsing"
      audience: internal
    - text: "IP threat intel providers share rate limiters with domain providers"
      audience: internal
    - text: "Added ip_count to request_log for independent IP analytics"
      audience: internal

- version: v0.40.0
  date: 2026-03-28
  changes:
    - text: "API key retrieval after checkout is now atomic — eliminates a race condition under concurrent requests"
      audience: internal
    - text: "Removed unique constraint on customer name to allow multiple customers with the same name"
      audience: internal
    - text: "Domain input validation now rejects ports, paths, query strings, fragments, and userinfo"
      audience: public
    - text: "Domain names are lowercased during normalization for consistent caching"
      audience: internal
    - text: "Removed dead code in Stripe checkout handler"
      audience: internal
    - text: "Screenshot capture now routes all Chrome traffic through a local SSRF-safe proxy"
      audience: internal
    - text: "Replaced per-request last_used_at goroutines with a batched writer (configurable via auth.last_used_buffer_size and auth.last_used_flush_interval)"
      audience: internal
    - text: "Checkout webhook now fails on plan determination errors so Stripe retries instead of silently defaulting to basic"
      audience: internal
    - text: "Screenshot proxy now strips hop-by-hop headers (Proxy-Connection, etc.) before forwarding to origin servers"
      audience: internal

