# Changelog — Intelligence API
# audience: public (shown on docs page), internal (admin/ops only)
#
# Pre-1.0 entries stay public for now: an empty release-notes section on a live
# docs page reads worse than a detailed one, and there is no reason to hide the
# history while the product is pre-launch. They get flipped to internal
# immediately before v1.0 ships so the customer-facing notes start clean — see
# issue #51. The admin endpoint (GET /v1/admin/changelog) is unfiltered either
# way, so nothing is ever lost operationally.

- version: v0.65.0
  date: 2026-07-31
  changes:
    - text: "Screenshots should start working again on small deployments. Captures were failing with a browser startup timeout, and because a failed lookup returns 200 with the reason in the errors array rather than an HTTP error, the failure was easy to miss entirely"
      audience: public
    - text: "screenshot.timeout default raised from 15s to 45s. A cold Chromium on a small shared-CPU machine regularly needs longer than 15s just to announce its DevTools endpoint, so captures were failing before the browser had finished starting"
      audience: public
    - text: "screenshot.max_concurrent default lowered from 4 to 1. Each in-process browser wants roughly half a gigabyte, so four could exhaust a machine sized for the API and take the whole process down. That was masked only because captures were dying during startup; raising the timeout without this would have turned a broken feature into an outage"
      audience: internal
    - text: "Chromium now runs with --disable-dev-shm-usage and a set of flags trimming work a one-shot capture never benefits from. Containers get a 64MB /dev/shm by default and Chromium assumes far more, which surfaces as a startup timeout rather than as anything mentioning shared memory"
      audience: internal
    - text: "Screenshot capture moved behind domain.ScreenshotProvider (Name, Capture), selected by screenshot.provider and defaulting to chromium. An unrecognized name fails startup rather than silently falling back, since that would start a browser on a machine provisioned on the assumption it would not. Screenshots are the only lookup needing a browser, and in-process capture caps concurrency at about one browser per 500MB — bulk capture is not reachable by buying a larger instance, so a hosted provider needs to be a wiring change"
      audience: internal
    - text: "TestConfig_Defaults asserted against the process-wide Viper, which merges in any config file on the search path. On a host carrying /etc/security-accelerated/intelligence-api.yaml it therefore tested the machine's configuration rather than the defaults, and a changed default read back as its old value locally while failing in CI. Defaults are now built into a fresh Viper by setDefaults"
      audience: internal

- version: v0.64.0
  date: 2026-07-31
  changes:
    - text: "Release notes have moved to their own page at /docs/changelog, linked from the top nav of every docs page. They previously ran down the bottom of both the overview and the domain reference, which put a list that only grows on two pages people open to look something up"
      audience: public
    - text: "The full response example is now the last section on both reference pages, immediately before the end, rather than sitting between the field docs and Caching"
      audience: public
    - text: "Fixed the overview page footer. The panel declared a three-column grid and the markup had grown to four children, so the support address wrapped onto a second row and sat under the copyright with an alignment meant for a column it was no longer in. It is now two flex groups — identity left, links right — which cannot break when a link is added or removed"
      audience: internal
    - text: "The IP page sidebar listed Example before Validation while the page had them the other way round, so working down the nav jumped backwards through the document"
      audience: internal
    - text: "TestDocs_SidebarMatchesDocumentOrder checks every reference sidebar for links pointing at anchors no heading defines, and for entries listed out of document order. Both are invisible on the rendered page unless you happen to click the wrong link, and moving a section is exactly when they happen"
      audience: internal
    - text: "Page-wide docs tests now iterate a shared list of pages rather than hardcoding paths, so a new page cannot quietly opt out of the CSP, inline-script, footer, or OpenAPI-link assertions. The changelog page was picked up by all of them on the first run"
      audience: internal
    - text: "The internal-audience filter is now asserted on every docs page rather than only the one rendering the list, since that filter is the only thing keeping internal notes off a public page"
      audience: internal
    - text: "POSTGRES_URL is now accepted as a complete connection string and takes precedence over the individual POSTGRES_* settings. Managed providers issue one URL, and splitting it into host/user/password/dbname to reassemble it drops any parameters carried in the query string — endpoint IDs, channel binding, pooler options — which surfaces as an authentication failure rather than as missing configuration"
      audience: internal

- version: v0.63.0
  date: 2026-07-31
  changes:
    - text: "The domain and IP docs pages now show the headers returned with a lookup, not just the JSON body. The full response example gained a Response Headers section covering X-Request-ID, the echoed X-Client-Request-ID, and the rate limit pair"
      audience: public
    - text: "CORRECTION: the IP docs page said X-Client-Request-ID accepted \"any string up to 128 chars\". The real limit is 64 characters, restricted to letters, digits, hyphens, underscores, dots, and colons. An ID that fails validation is ignored rather than rejected, so anyone following the old text would have sent a longer ID, received 200, and silently lost their tracing with nothing to explain it. Both pages now state the enforced rule and call out the silent-drop behaviour"
      audience: public
    - text: "The OpenAPI spec documented no response headers at all and never mentioned X-Client-Request-ID, so generated clients had no idea either existed. Added components.parameters.ClientRequestID and components.headers, wired into every 200 and the shared 429 response across all four documented endpoints"
      audience: public
    - text: "Both docs pages claimed \"every response includes rate limit headers\", which is not true for every request path. Reworded to describe what the headers report without asserting they are universal"
      audience: internal
    - text: "clientRequestIDMaxLen is now exported as middleware.ClientRequestIDMaxLen, since the docs pages and the OpenAPI spec both publish the number"
      audience: internal
    - text: "TestDocs_ResponseHeadersDocumented asserts both pages name every observable response header and state the limit derived from the middleware constant. TestOpenAPIMatchesCorrelationIDContract runs candidate IDs through both the spec's regex and the real middleware and requires the same verdict, rather than comparing the two patterns as strings. Both were confirmed to fail against the old wrong values"
      audience: internal
    - text: "Docs detail pages gained the OpenAPI spec link in the footer and sidebar nav, so the machine-readable contract is reachable from the reference pages rather than only the overview"
      audience: internal
    - text: "Correlation headers are documented on error responses too, not only on 200. Review flagged the 429; checking the middleware chain showed it applies to every error, since ClientRequestID and RequestLogger write their headers before anything downstream can abort. All five shared error responses now declare them, so a caller reading the spec no longer concludes their correlation ID is dropped on exactly the responses they most need to trace"
      audience: internal
    - text: "The X-RateLimit pair is deliberately not declared on the shared error responses: the limiter runs after authentication and returns early without an API key in context, so a 401 never reaches it"
      audience: internal
    - text: "Two more tests: TestOpenAPIDeclaresCorrelationHeadersOnEveryResponse walks every documented response in the spec, and TestClientRequestID_SurvivesAbortedResponses asserts the middleware actually emits both headers across 400/401/403/429/500. Together they check the claim from both sides rather than trusting the chain order to stay put"
      audience: internal

- version: v0.62.0
  date: 2026-07-31
  changes:
    - text: "Screenshot lookups now honour their configured timeout when the browser is slow to start, instead of overrunning it. On a loaded host a capture could hold a browser slot well past its deadline, delaying other screenshot requests queued behind it"
      audience: public
    - text: "chromedp caps the wait for Chrome to announce its DevTools URL at a fixed 20s and watches only its own timer, never the context. With screenshot.timeout defaulting to 15s that wall sat outside our budget entirely: a slow launch overran the deadline by up to 20s while holding one of screenshot.max_concurrent slots, and a longer budget could not buy a cold machine more startup time"
      audience: internal
    - text: "captureScreenshot now passes chromedp.WSURLReadTimeout derived from whatever remains of the caller's deadline, making the screenshot timeout the single authority over a capture's length. An already-spent budget yields a non-positive duration, which fails immediately rather than waiting 20s to report a certainty"
      audience: internal
    - text: "Found via a CI flake: the headless-Chrome SSRF regression test failed at exactly 20.04s on a cold runner. Chrome had not crashed — chromedp reports that case differently — it was simply slower to launch than the fixed wall allowed. The test's own budget is now well clear of the slowest plausible start, since a browser that fails to launch proves nothing about containment and only costs a red build"
      audience: internal

- version: v0.61.0
  date: 2026-07-31
  changes:
    - text: "Lookups no longer report an upstream failure as an absent record. A threat intelligence provider that could not be reached, a BGP lookup whose queries all failed, an unreadable certificate transparency response, or email security records that could not be resolved are now reported as errors rather than as clean, empty results"
      audience: public
    - text: "This matters most for threat intelligence: a rate-limited VirusTotal used to return \"not detected\", which scoring counted at its full 0.50 weight, so a domain nobody checked scored the same as a domain checked and found clean"
      audience: public
    - text: "VirusTotal and the three IP adapters used limiter.Allow() and returned a synthetic clean result; they now use limiter.Wait(ctx) and return an error, matching URLhaus and AlienVault. The coordinator already excludes errored providers from scoring"
      audience: internal
    - text: "Partial results are no longer cached. multiErrRunner returns data alongside per-provider errors and only the payload was stored, so a cache hit replayed a partial result as a complete, error-free success with no retry until the TTL expired"
      audience: internal
    - text: "LookupBGP returns an error when every Cymru origin lookup fails instead of an empty record set cached for 24 hours"
      audience: internal
    - text: "LookupEmailSecurity distinguishes NXDOMAIN/NODATA from timeouts and SERVFAIL via isDNSAbsence. A domain that publishes no SPF or DMARC is still a successful empty answer; a domain whose lookups could not complete is an error"
      audience: internal
    - text: "parseCrtShResponse returns an error on malformed JSON rather than nil. Because the body is read through io.LimitReader, an oversized response arrives truncated mid-structure and took the same silent path"
      audience: internal
    - text: "DNSSEC no longer uses a truncated UDP response when the TCP retry fails — it moves to the next resolver, since incomplete answers would report DNSKEY or CAA records as missing when they exist"
      audience: internal
    - text: "Two service tests asserted the old caching behaviour and were rewritten; the external review noted they blessed the defect"
      audience: internal

- version: v0.60.0
  date: 2026-07-30
  changes:
    - text: "SECURITY: fixed an SSRF weakness in the screenshot lookup. Headless Chrome could reach loopback and link-local addresses directly, so a page that passed the pre-flight safety check could redirect the browser to an internal service or cloud metadata endpoint and have it captured"
      audience: public
    - text: "Chromium bypasses the configured proxy for loopback and link-local addresses by default, so chromedp.ProxyServer alone never contained it — safenet saw none of that traffic. Added --proxy-bypass-list=<-loopback>, which removes the implicit bypass"
      audience: internal
    - text: "Reproduced before fixing: a Chrome capture aimed at a loopback HTTP server delivered 2 requests to it. After the fix, zero. The regression test asserts the capture ran to completion before asserting containment, so a browser that fails to launch fails the test rather than passing it"
      audience: internal
    - text: "captureScreenshot had no test coverage at all; it now has a real headless-Chrome regression test"
      audience: internal
    - text: "CI now runs the full test suite before publishing an image or deploying. docker.yml and fly-deploy.yml built and shipped without running anything, so a failing test could reach production unnoticed"
      audience: internal
    - text: "test.yml is a reusable workflow (workflow_call) invoked by both pipelines through needs:, and runs directly on pull requests. It checks gofmt, go mod tidy -diff, go vet, build, unit tests with -race, and the tagged integration suite"
      audience: internal
    - text: "No push trigger on test.yml: pushes to main run docker.yml and pushes to release run fly-deploy.yml, both of which call it, so a push trigger would run the whole suite twice"
      audience: internal
    - text: "actionlint runs as the first CI step, since a typo in needs: would leave the gate silently not gating. Verified it catches exactly that"
      audience: internal
    - text: "The CI gate provisions Chrome and sets REQUIRE_CHROME so the screenshot SSRF regression test cannot silently skip — a skipped test looks identical to a passing one in the run summary. A shell step is used rather than a third-party setup action, since this job holds a repository token"
      audience: internal
    - text: "Checkouts no longer persist GITHUB_TOKEN, jobs declare contents: read, and actionlint is pinned to a commit SHA verified through the GitHub API"
      audience: internal

- version: v0.59.0
  date: 2026-07-30
  changes:
    - text: "Fixed a bug where the service could lose its database connection after a few minutes of uptime in deployments that address Postgres or Redis by an internal hostname"
      audience: public
    - text: "InitResolver no longer overrides net.DefaultResolver. It sets a resolver scoped to the domain package, returned by domain.Resolver(), which the 11 lookup call sites now use explicitly"
      audience: internal
    - text: "Overriding the global sent every resolution in the process to public DNS, including the service's own infrastructure connections. app.go called InitResolver after Postgres and Redis connected, but that only protected the initial connections: database/sql recycles on conn_max_lifetime (5m) and conn_max_idle_time (2m), and every replacement failed with 'no such host'. Production was unaffected because Neon and Upstash are public hostnames; local dev broke minutes after every start, and Kubernetes service DNS or Fly .internal addresses would have broken immediately"
      audience: internal
    - text: "The startup-ordering constraint in app.go is gone with it — InitResolver can now run at any point, since nothing outside the domain package changes how it resolves names"
      audience: internal
    - text: "TestInitResolver_SetsDefaultServers now asserts net.DefaultResolver.Dial stays nil, so reinstating the global override fails the build"
      audience: internal

- version: v0.58.0
  date: 2026-07-30
  changes:
    - text: "Docker Compose now passes MAXMIND_LICENSE_KEY through from .env, so local dev downloads and persists the GeoIP databases to ./data/maxmind the same way production does. Previously geo and asn were permanently unavailable locally"
      audience: internal
    - text: "The smoke test asks /v1/health about GeoIP before the geo/asn content checks and reports the cause, rather than emitting opaque 'jq filter failed' lines. Still a failure, not a warning — geo being unavailable is a real problem wherever it runs"
      audience: internal
    - text: "The OpenAPI spec at /docs/openapi.yaml was still describing the pre-v0.54.0 request contract — per-feature booleans instead of the `lookups` array, a bare array response instead of the `results` envelope, and a top-level `cache_hit`. Anyone generating a client from it would have built requests that fail validation. It now matches the live API"
      audience: public
    - text: "The domain docs page listed `dns_security` as an optional boolean request field alongside `lookups`. That row is gone; dns_security is a lookup name, as the Valid Lookups table already showed"
      audience: public
    - text: "OpenAPI now documents `lookups` with an enum of valid names on both endpoints, both request fields as required, the results envelope, per-lookup cache_hit on all 18 lookup schemas, and the `inputs` array on responses"
      audience: internal
    - text: "TestOpenAPIMatchesLookupContract compares the spec's lookups enum and required fields against domain.AllLookupNames and AllIPLookupNames, so adding a lookup without updating the spec now fails CI"
      audience: internal
    - text: "The sales overview was missing DNSSEC/CAA and the aggregate risk score entirely — two shipped features it never mentioned — and its example request omitted both names. Added sections for each and corrected the example"
      audience: internal
    - text: "api.http gained a risk example; it was the only lookup with no request in the file"
      audience: internal
    - text: "TestDocs_RequestBodyListsOnlyContractFields asserts the docs request-body tables list only the target array and lookups — a per-feature boolean row reappearing fails the build. Grepping could not catch the stale row, since the lookup names legitimately appear all over those pages"
      audience: internal

- version: v0.57.0
  date: 2026-07-30
  changes:
    - text: "GeoIP databases now load themselves at startup and persist across restarts. `geo` and `asn` were unavailable after most restarts because the databases had to be bootstrapped by hand; they are now stored on a volume and downloaded automatically on boot when missing or out of date"
      audience: public
    - text: "The download runs in a background goroutine rather than blocking startup — it is around 80MB, and blocking would delay the listener past the platform health check on every cold start. geo and asn report that they are unavailable for the first few seconds instead"
      audience: internal
    - text: "New maxmind.max_age (default 168h) re-downloads databases older than that at startup; MaxMind publishes GeoLite2 updates twice a week. 0 disables the check. A stale database is loaded first and refreshed behind it"
      audience: internal
    - text: "A database that exists but cannot be opened — a truncated download from a killed machine — is now treated as absent and re-downloaded rather than leaving an empty reader in place"
      audience: internal
    - text: "planGeoIP isolates the load/download decision from the download itself, so the startup behaviour is covered by tests that need no network"
      audience: internal
    - text: "Added a maxmind_data volume mounted at /data/maxmind. Machine filesystems are recreated from the image on every start, so without it the databases are re-downloaded on every cold start"
      audience: internal
    - text: "Fly requires one volume per machine — two volumes for two machines, provisioned in separate zones"
      audience: internal
    - text: "Volumes mount root-owned with no uid/gid option, so docker-entrypoint.sh chowns the mount as root and execs the app as appuser via su-exec. The Dockerfile no longer sets USER; the application still runs unprivileged. An unwritable mount warns loudly and keeps serving rather than crash-looping the machine over one degraded lookup"
      audience: internal

- version: v0.56.0
  date: 2026-07-30
  changes:
    - text: "DNS lookups now fail over correctly. Failover never triggered over UDP, so a lookup could stall on an unresponsive resolver instead of moving to the next one; a resolver that cannot be reached at all is now skipped as well"
      audience: public
    - text: "The Go code examples on the docs pages declared the same variable twice and did not compile. The JavaScript, Python and Go examples on the IP page were also still on the pre-v0.55.0 request contract"
      audience: public
    - text: "A target that rejects the TLS handshake is reported as a finding about that target rather than as an internal error"
      audience: public
    - text: "failoverConn retries the pending query against the next server when one goes silent, since UDP dials succeed for any routable address and a dial-time loop always selects the first server. Dial errors cascade too, for the unroutable case"
      audience: internal
    - text: "Lookup error classification keys on types and sentinels (errors.Is/errors.As) instead of substring matches on message text, so a dependency rewording an error no longer silently changes what pages someone"
      audience: internal
    - text: "Remote TLS alerts arrive as *net.OpError{Op: \"remote error\"} with an unexported alert type, so the tls.AlertError check never matched a real handshake failure; both shapes are now classified"
      audience: internal
    - text: "The test suite no longer touches the network — DNS tests run against a local miekg/dns server and TLS classification against a loopback listener, so the suite passes with no egress at all"
      audience: internal
    - text: "TestDocs_GoExamplesCompile builds each page's Go example rather than string-matching it; the smoke test's crt.sh assertion no longer downgrades failures from our own API to warnings"
      audience: internal

- version: v0.55.0
  date: 2026-07-30
  changes:
    - text: "BREAKING: IP lookups now take the same `lookups` array as domain lookups. The `threat_intel` boolean is gone; valid names are geo, asn, reverse_dns, abuse_contact and threat_intel"
      audience: public
    - text: "BREAKING: IP responses are wrapped in a `results` envelope and the top-level `cache_hit` is replaced by a per-lookup `cache_hit`, matching the domain endpoint"
      audience: public
    - text: "IP results now report the canonicalized `ip` plus an `inputs` array of the original entries that mapped to it. Addresses that canonicalize to the same value are deduplicated, so 2001:DB8::1 and 2001:db8:0:0:0:0:0:1 return one result"
      audience: public
    - text: "IP lookups are cached individually with their own TTLs — 24h for abuse_contact, 6h for reverse_dns, 30m for threat_intel — so a slow RDAP lookup no longer shortens everything else's cache lifetime"
      audience: public
    - text: "geo and asn are no longer cached at all. They read a local database with no network call, so recomputing them is faster than a cache round trip; their cache_hit is always false"
      audience: public
    - text: "Requesting a domain-only lookup name (such as whois) on the IP endpoint now returns 400 rather than being silently ignored"
      audience: public
    - text: "IP cache keys use a separate `ip:<ip>:<lookup>` namespace, so threat_intel on the two endpoints cannot collide"
      audience: internal
    - text: "Extracted the per-lookup runner machinery into service/runner.go, shared by both services; service/whole_response.go and its copyViaJSON/goLookup helpers are deleted with no remaining callers"
      audience: internal
    - text: "Negative caching removed from the IP service too, and redis.negative_cache_ttl deleted — per-lookup keys made it unnecessary on both endpoints"
      audience: internal
    - text: "A missing GeoIP database is now classified as an expected error rather than special-cased in the IP service, so it still does not trigger alerts"
      audience: internal
    - text: "request_log gains geo/asn/reverse_dns/abuse_contact columns (migration 015)"
      audience: internal

- version: v0.54.0
  date: 2026-07-30
  changes:
    - text: "BREAKING: domain lookups now require a `lookups` array naming exactly which lookups to run. The per-feature booleans (screenshot, reputation, email_security, subdomains, ct_logs, bgp, fingerprint, threat_intel) are gone, and whois/dns/ssl/headers are no longer implicit — nothing runs unless you ask for it"
      audience: public
    - text: "BREAKING: lookup responses are now wrapped in a `results` envelope instead of a bare JSON array, so every response is a JSON object"
      audience: public
    - text: "BREAKING: the top-level `cache_hit` field is gone. Each lookup object now carries its own `cache_hit`, since lookups are cached independently"
      audience: public
    - text: "Each result now reports the normalized `domain` plus an `inputs` array listing the original request entries that mapped to it. Match results by `domain` — array position is not part of the contract"
      audience: public
    - text: "Domains that normalize to the same name are deduplicated into a single result. Plan domain limits still count the entries you submit"
      audience: public
    - text: "Lookup names and domains are trimmed, lowercased, and deduplicated before validation, so `[\" SSL \", \"ssl\"]` and `Example.COM` behave as expected"
      audience: public
    - text: "Results are now cached per lookup rather than per response, each with its own TTL — 30 minutes for dns/headers/reputation/threat_intel, 4 hours for ssl/email_security, 24 hours for whois/ct_logs/subdomains/bgp, 60 minutes for screenshot. A lookup you fetched yesterday is reusable today regardless of what else you request alongside it"
      audience: public
    - text: "Requesting headers and fingerprint together now costs a single headers fetch. Fingerprint has no cache entry of its own, so fingerprint rule updates take effect immediately"
      audience: public
    - text: "New 400 responses for a missing/empty `lookups` array and for unrecognized lookup names; requesting a lookup outside your plan returns 403 naming that lookup"
      audience: public
    - text: "`dns_security` (DNSSEC + CAA) is now selected like any other lookup rather than via its own flag"
      audience: public
    - text: "BREAKING: the aggregate `risk` score is now opt-in. Add \"risk\" to `lookups` to get it — it still costs no extra network call and scores over whatever else you requested"
      audience: public
    - text: "Domain lookups no longer cache failures. Per-lookup TTLs mean one flaky provider can no longer shorten every other lookup's cache lifetime, and a failing lookup is retried rather than remembered. IP lookups still negative-cache, since they are cached as a single document"
      audience: public
    - text: "Cache keys are now flat `lookup:<domain>:<name>` entries; the composite sorted-suffix key builder has been removed"
      audience: internal
    - text: "service.Lookup() issues a single MGET for all requested lookups and spawns goroutines only for the misses; each goroutine writes its own result with that lookup's TTL"
      audience: internal
    - text: "Cache failures are fail-open throughout — read errors and corrupt entries degrade to live lookups (overwriting the bad entry), and failed writes are logged without affecting the response"
      audience: internal
    - text: "Replaced redis.cache_ttl with cache.default_ttl plus per-lookup cache.ttl.* keys; env overrides work per Viper convention (CACHE_TTL_WHOIS, CACHE_DEFAULT_TTL)"
      audience: internal
    - text: "request_log now records per-lookup cache_hits/cache_misses counts instead of a per-request cache_hit boolean, and tracks the four base lookups alongside the optional ones (migration 012)"
      audience: internal
    - text: "Admin usage endpoint reports cache hit rate from per-lookup counts and includes whois/dns/ssl/headers in feature_usage"
      audience: internal
    - text: "/v1/info cache section now reports default_ttl plus the resolved per-lookup TTL table"
      audience: internal
    - text: "Singleflight coalescing is now keyed per lookup per domain instead of per response, so requests asking for overlapping-but-different lookup sets share the overlap"
      audience: internal
    - text: "Coalesced callers each decode the shared payload into their own response, replacing the copy-via-JSON guard against shared-pointer mutation"
      audience: internal
    - text: "The global Chromium semaphore now lives inside the screenshot lookup runner"
      audience: internal

- version: v0.53.0
  date: 2026-06-12
  changes:
    - text: "Improved reliability under load: heavy lookups are now bounded and isolated so one slow or failing lookup can't affect other requests"
      audience: public
    - text: "Panic recovery in all lookup goroutines — a panicking lookup degrades to a per-lookup error instead of killing the process"
      audience: internal
    - text: "Provisioned API key plaintext is blanked on retrieval and expired rows are swept on an interval (billing.cleanup_interval, default 10m)"
      audience: internal
    - text: "Global semaphore caps concurrent Chromium screenshots (screenshot.max_concurrent, default 4)"
      audience: internal
    - text: "crt.sh requests (subdomains, CT logs) now have end-to-end HTTP timeouts (subdomain.http_timeout / ct_logs.http_timeout, default 15s)"
      audience: internal
    - text: "safenet blocks TEST-NET, benchmarking, 240/4, 0/8, 192.0.0.0/24, and IPv6 documentation ranges; IPv4-mapped IPv6 unmapped before checks; migrated to netip.Addr"
      audience: internal
    - text: "Singleflight copy failures return an isolated error response instead of a shared pointer (CodeRabbit finding)"
      audience: internal

- version: v0.52.0
  date: 2026-06-11
  changes:
    - text: "Every domain lookup now includes an aggregate risk score (0–100 with risk level and per-component breakdown) computed from all returned data"
      audience: public
    - text: "New dns_security option — DNSSEC deployment (DS/DNSKEY, signing algorithms) and CAA records, available on all plans"
      audience: public
    - text: "email_security now also checks MTA-STS (including the published policy), TLS-RPT, and BIMI"
      audience: public
    - text: "New GET /v1/usage — view your own request counts, cache hit rate, and feature usage"
      audience: public
    - text: "New POST /v1/keys/rotate — self-service API key rotation; old keys keep working for a 24h grace window"
      audience: public
    - text: "Machine-readable OpenAPI 3.1 spec now served at /docs/openapi.yaml"
      audience: public
    - text: "All responses now include Strict-Transport-Security, Referrer-Policy, and Content-Security-Policy headers"
      audience: public
    - text: "Failed lookups are now retried sooner: error responses cache for a short negative TTL instead of the full cache window"
      audience: public
    - text: "Removed all inline JavaScript from docs and checkout pages; scripts are now served as external files under a strict page CSP"
      audience: internal
    - text: "Concurrent identical lookups now coalesce via singleflight; lookups detached from client cancellation"
      audience: internal
