# Changelog — Intelligence API
# audience: public (rendered on the docs pages), internal (not rendered there)
#
# "internal" controls what /docs shows, not who can read it: this file is in a
# public repository, and GET /v1/admin/changelog returns every entry.
#
# Public entries are the full history, pre-1.0 included, and stay public. They
# describe what a caller sees; operator detail (config keys, admin endpoints,
# infrastructure) and upstream feed names go in internal entries or generic
# terms (#91). An entry a later release reversed keeps its text and gains a
# "superseded in vX" note, rather than being hidden or rewritten.

- version: v1.0.0
  date: 2026-09-23
  changes:
    - text: "The overview and domain reference each had a Plans table and a Pricing section repeating the same limits. They are one Plans section now, with the link to get a Pro key under the table. The docs are technical reference and state no price"
      audience: public
    - text: "Three places still said an aggregate risk score comes with every response. It has been opt-in since v0.54.0: add `risk` to `lookups` to get it"
      audience: public
    - text: "#77 closed as not planned: the API docs stay technical and show no price. The Stripe payment and portal links are still rendered from config under Plans"
      audience: internal

- version: v0.75.0
  date: 2026-09-23
  changes:
    - text: "BREAKING: the `screenshot` lookup has been removed. Captures were not reliable enough to charge for, and a failed capture returned 200 with the reason in `errors`, so the failure was easy to miss. Asking for `screenshot` now returns 400 naming it as an unknown lookup. It is planned to return on a more reliable capture backend"
      audience: public
    - text: "Removed with it: the Chromium provider and ScreenshotProvider interface, the capture semaphore, the browser SSRF proxy (safenet.NewSafeProxy, used only by screenshots), chromedp and its transitive modules, Chromium in the image, the screenshot.* config keys and cache.ttl.screenshot, and the CI Chrome provisioning with REQUIRE_CHROME. request_log.screenshot stays for its history and defaults to false. #110 records the diagnosis (the 45s capture timeout was nested under the 30s lookup timeout) and the options for bringing it back"
      audience: internal
    - text: "The docs describe what each lookup returns, not which upstream feeds answer it: feed names, blocklist names, and threat-intel weightings are gone from the prose on /docs/domain and /docs/ip (#91). Response fields that carry a provider or source value are unchanged, so the examples still show them"
      audience: internal
    - text: "BREAKING: `geo` no longer returns `postal_code`, `region_code`, `timezone`, or `accuracy_radius`. All four were optional; the geolocation source now in use does not provide them, so they were removed rather than documented as always absent"
      audience: public
    - text: "`asn` now includes `network`, the announced prefix containing the address (for example `8.8.8.0/24`), and works for IPv6 as well as IPv4. `organization` now carries the registered AS handle and name, for example `GOOGLE - Google LLC` where it was `GOOGLE`. It is cached for 24 hours like the other network lookups, so repeat requests report `cache_hit: true`"
      audience: public
    - text: "MaxMind GeoLite2 is gone. Its EULA requires written consent before disclosing the data to third parties, which a paid API does. `geo` now reads DB-IP Lite City (CC BY 4.0, attribution in the /docs/ip footer), streamed from the monthly .mmdb.gz over trustedTransport with a fallback to the previous month before the new one is published. `asn` now queries Team Cymru DNS through the helpers `bgp` already used, gaining IPv6 (origin6 nibble names) and the prefix MaxMind's reader never exposed"
      audience: internal
    - text: "Config moves from maxmind.* to geoip.* (geoip.db_path /data/geoip, geoip.city_db dbip-city-lite.mmdb, geoip.max_age 720h); MAXMIND_LICENSE_KEY is retired and the download needs no key. New cache.ttl.asn (24h). The Fly volume keeps its maxmind_data name but mounts at /data/geoip. The old download buffered the whole database in memory and used a bare http.Client outside safenet; the new one streams to disk through trustedTransport"
      audience: internal
    - text: "Pre-1.0 release notes stay public instead of being flipped to internal (#51 reversed). The public set was curated instead: v0.9.0 claimed Google Safe Browsing and PhishTank, which never shipped, and now names what did; reversed entries carry a \"superseded in vX\" note; feed names became generic terms; config keys, admin endpoints and infrastructure detail were dropped from public text; and the v0.65.0 screenshot.timeout entry moved to internal"
      audience: internal

- version: v0.74.1
  date: 2026-08-27
  changes:
    - text: "Built with Go 1.27. The go directive, the builder image, and the documented prerequisite move together; both setup-go steps read go-version-file: go.mod, so CI follows without a workflow edit"
      audience: internal
    - text: "golangci-lint moves from v2.12.2 to v2.13.1, because v2.12.2 cannot lint Go 1.27 at all. It vendors honnef.co/go/tools v0.7.0, whose IR builder panics on the 1.27 standard library and takes goanalysis_metalinter with it — the lint job then exits without reporting a finding, so the gate stops gating instead of failing loudly. Bumping the pin is part of the toolchain bump, not a separate upgrade"
      audience: internal

- version: v0.74.0
  date: 2026-08-27
  changes:
    - text: "Release notes on the docs page now show field and parameter names as inline code instead of printing the backticks around them"
      audience: public

- version: v0.73.0
  date: 2026-08-27
  changes:
    - text: "Plans are now Free and Pro. The Basic tier is gone; its rate limit, batch size, Stripe price, and payment link have been removed, and the plan tables in the docs and OpenAPI spec now show two columns"
      audience: public
    - text: "Migration 017 moves any remaining basic customer to pro rather than free, so the merge cannot take capability away from an existing key"
      audience: internal
    - text: "The customers.plan column defaulted to 'basic' — set by migration 002 and carried through the tier→plan rename in 006. Migration 017 resets it to 'free'. Left alone, any INSERT omitting plan would have kept minting rows on a plan nothing recognizes"
      audience: internal
    - text: "RateLimitConfig.Basic was the fallback limit for an unrecognized plan, so an unknown value silently got 30 req/min. The fallback is now Free, matching how lookup gating already treated unknown plans — a bad plan value fails closed"
      audience: internal
    - text: "Smoke suite drops SMOKE_BASIC_KEY; assertions that duplicated a free or pro twin were removed and the rest moved to the pro key. The seed no longer creates a basic customer"
      audience: internal
    - text: "The quickstart's example response described a shape the API does not return: the DNS fields are `a` and `mx`, not `a_records` and `mx_records`, and `mx` is an array of {host, priority} objects rather than strings. The quickstart is the first thing a new customer copies, so it was the one example most likely to be pasted into a client"
      audience: public
    - text: "`errors` is omitted from a fully successful response — it is never `[]`. Six examples showed an empty array and two sentences promised the field was always present; the success examples drop it and the prose now says it appears only when a lookup failed. The OpenAPI spec already had this right"
      audience: public
    - text: "The overview no longer says each result contains exactly the lookups you requested. That reads as a guarantee that n requested lookups produce n fields, and a lookup that fails outright has its field omitted with the reason in `errors`. Both documents said so correctly further down; the summary sentence a reader skims first was the one place contradicting them"
      audience: public
    - text: "Deploying is now a `v*` tag rather than a push to a release branch, and the release branch is retired. The version baked into the binary is the tag name, so it cannot drift from what was tagged — the old flow read it with `git describe` and mislabelled any deploy whose release PR was squashed or rebased. workflow_dispatch with a tag input is the rollback path, which did not exist before"
      audience: internal
    - text: "Hardening on that workflow: the tag reaches the shell through a job-level env var rather than template expansion inside a run line, the checkout names refs/tags/ explicitly so a branch cannot pose as a release tag, and setup-flyctl is pinned to a commit — it ran one step before the Fly token entered scope on a mutable @master ref"
      audience: internal
    - text: "The GHCR publish caches build layers in the Actions cache, turning `apk add chromium` and `go mod download` into cache hits. The 90s go build layer still misses, because every trigger changes one of its inputs. Cache export failures are ignored rather than failing a job whose image already pushed"
      audience: internal
    - text: "CodeRabbit no longer posts its review-in-progress and skip-status comments. Both carried no review content and each one was a notification email; progress is already a check run. The walkthrough and inline findings are untouched"
      audience: internal

- version: v0.72.1
  date: 2026-08-27
  changes:
    - text: "The first request after a quiet period is now as fast as any other. Previously the service scaled to zero after ten idle minutes and the next request paid a cold start"
      audience: public
    - text: "Machine memory raised from 512 MB to 1 GB. Headless Chromium wants roughly half a gigabyte per capture, so the screenshot lookup was one request from the ceiling; screenshot.max_concurrent stays at 1, it just has room now"
      audience: internal
    - text: "Repo instructions restructured for coding agents: AGENTS.md as the always-on file, package rules under .claude/rules/ that load by path, docs/decisions.md for the load-bearing choices, RELEASE.md as the declared release flow, and a make verify target (#90)"
      audience: internal
    - text: "v0.71.0 and v0.72.0 were written here but never tagged or deployed; production ran v0.70.0 until this release, which ships all of it. The releasing skill now fetches tags before choosing a version so this cannot recur silently"
      audience: internal

- version: v0.72.0
  date: 2026-08-14
  changes:
    - text: "The SSRF proxy that headless Chrome browses through now sets ReadHeaderTimeout. Without it a client that opens a socket and dribbles request headers holds a goroutine indefinitely. The listener is loopback-only so this was not reachable from outside, but it is one field"
      audience: internal
    - text: "The DNS resolver's failover no longer ignores a failed SetReadDeadline. The per-server deadline is the only thing bounding a read, so if setting it failed the next read had no timeout at all — a blackholed server would consume the caller's entire budget and never fail over, which is the exact failure the failover type exists to prevent"
      audience: internal
    - text: "Two shadowed imports fixed. internal/logging declared a local named `config`, which made the config package it calls elsewhere in the same file unreachable inside that function"
      audience: internal
    - text: "cmd/api/main.go split into main and run. os.Exit skips deferred functions, so the log flush had been written twice — once deferred, once by hand before the exit — and every new exit path had to remember the second copy"
      audience: internal
    - text: "Ambiguous multi-value returns are now named: downloadMMDB returned (string, string, int64, error) and viewport returned (int, int). Also stopped copying an 80-byte fingerprint rule three times per rule per request, and a 136-byte usage entry once per buffered entry per flush"
      audience: internal
    - text: "The remaining gosec findings are annotated with why they are correct rather than left unexplained. InsecureSkipVerify is the SSL lookup's whole purpose, and the five SQL-formatting hits interpolate only generated placeholders and a fixed column list — the invariant that makes that safe is now written down next to the code that depends on it"
      audience: internal
    - text: "Lint backlog is 36 down to 10. The remainder are design decisions rather than edits: two duplicated provider fan-outs, two functions over the complexity threshold, and six by-value parameters where value semantics are deliberate"
      audience: internal

- version: v0.71.0
  date: 2026-08-13
  changes:
    - text: "Cleared the mechanical half of the golangci-lint backlog: 255 findings down to 36. The remainder are judgment calls — gosec suppressions that need a stated reason, two duplicated fan-out blocks, and a handful of by-value copies — and are being handled separately"
      audience: internal
    - text: "The RIR lookup behind an IP's abuse contact was a fifty-eight-branch switch of `first >= n && first <= n`, which is a table written as control flow. It is now a table. All 256 first-octets were diffed before and after to prove the mapping is unchanged, and it has a regression test for the first time"
      audience: internal
    - text: "make lint and the CI gate now pass --max-issues-per-linter=0 --max-same-issues=0. golangci-lint caps output at 50 per linter and 3 per identical message by default and says nothing about it, which is why the backlog was first recorded as 112. On the gate that cap could let a PR pass having been shown only part of what it introduced"
      audience: internal
    - text: "British spellings in comments and strings are now American, matching the fleet lint config's locale. This changed one user-visible string: the Pushover notification title for a canceled subscription is now 'Subscription Canceled'"
      audience: internal

- version: v0.70.0
  date: 2026-08-11
  changes:
    - text: "Every code block on the docs pages now has a copy button. The reference pages carry 40-plus line payloads, and dragging a selection through one on a phone means fighting the block's own sideways scroll"
      audience: public
    - text: "The docs pages have a search: press / or Cmd-K (Ctrl-K on Windows) and type a field or section name, arrows to move, Enter to jump. Every result says which lookup it belongs to, which the browser's own find cannot — cache_hit appears on all fourteen lookups, so find walks fourteen identical hits with no way to tell them apart"
      audience: public
    - text: "Both controls are built by docs.js at load rather than written into the templates, so the index cannot drift from the page it describes and there is no dead control when the script does not run. Nothing is fetched: the pages are already in the reader's browser, and the CSP stays as it is"
      audience: internal
    - text: "The copy button lives in a wrapper around the block, not inside it — a <pre> is its own scroll container, so a control placed inside slides away with the code exactly when a long payload is hardest to select. It copies textContent, never the syntax-highlighting markup, and no clipboard API means no button rather than one that always fails"
      audience: internal
    - text: "The search overlay takes its own scroll-lock class. body.shell-open is what slides the mobile drawer out, so reusing it would have opened the drawer behind the overlay on a phone"
      audience: internal
    - text: "Added a prefers-reduced-motion block, which the stylesheet had never had: the smooth scroll it now disables is shared by every sidebar link, not just the new search results"
      audience: internal

- version: v0.69.0
  date: 2026-08-10
  changes:
    - text: "The overview now opens with a working request. Authentication, plans, pricing, rate limiting and error handling all came before the first copy-pasteable call, so the page that should get you started explained the API before it showed it"
      audience: public
    - text: "/v1/usage and /v1/keys/rotate have a reference page of their own at /docs/account, with parameters, response fields, four-language examples, and the sequence for rotating a key without downtime. They are two of the four public endpoints and were the only two documented by a single table row"
      audience: public
    - text: "Documented that screenshot captures run under a small service-wide concurrency cap and that a capture which does not start before the request deadline reports 'screenshot queue timed out, please retry' in errors. Unlike most lookup errors that one is worth retrying — it means the service was busy, not that the answer is unavailable (superseded in v0.75.0: the screenshot lookup was removed)"
      audience: public
    - text: "Both reference pages now show what a real upstream failure looks like: a valid target, a 200 response, and the failed lookup's field absent entirely rather than null. Requesting n lookups does not guarantee n fields, and code reaching straight for result.whois.registrar works in testing and throws the first time an upstream has a bad minute"
      audience: public
    - text: "Documented that repeated key rotation never extends an expiry that is already set, so keys grace-expired by an earlier rotation keep their original deadline and rotation cannot be used to keep an exposed key alive"
      audience: public
    - text: "The OpenAPI spec carries the same two contracts: the screenshot queue timeout on the screenshot property, and the absent-field behaviour on the errors array"
      audience: public
    - text: "Documented what the lookup name in an errors entry actually tells you. A plain name (whois) means that lookup failed and its field is absent; a qualified name (`threat_intel:<provider>`) means one provider inside a fan-out lookup failed while the others answered, and that lookup's field is still present. Treating every errors entry as a missing field throws away good partial results from reputation and threat_intel"
      audience: public
    - text: "docsPages in docs.go is now the canonical page set — routes are registered by looping it and tests derive their lists from it. The set was previously spelled out in six places, and adding /docs/account meant finding them all by hand. The nav test caught only the last of them"
      audience: internal
    - text: "Found while wiring that up: the language-tab, Go-compile and request-contract tests each carried their own hard-coded two-page list, so the new page's Go example was not being compiled. The first two now select pages that actually carry tabs; the third stays scoped to the lookup pages, since it asserts the lookup request contract the account examples do not share"
      audience: internal
    - text: "The rotation wording was checked against the SQL rather than assumed: RotateKey only sets expires_at where it is NULL or later than the new grace expiry, which is what makes repeated rotation unable to extend an exposed key's life"
      audience: internal
    - text: "Review caught two over-claims in the first draft: errors was described as always meaning an absent field, which is wrong for the fan-out lookups, and screenshot concurrency was stated as one at a time when screenshot.max_concurrent is configurable. The README also still said each customer has one API key, which migration 012 stopped being true"
      audience: internal

- version: v0.68.0
  date: 2026-08-10
  changes:
    - text: "The documentation now fits a phone. Every page scrolled sideways and ran body text off the screen at any width below roughly 500px, which made the reference unreadable on the device people reach for first"
      audience: public
    - text: "Reference tables that are too wide for a narrow screen now scroll on their own instead of taking the page with them, and long unbreakable tokens — header names, IPv6 addresses, config keys — wrap instead of painting past the edge"
      audience: public
    - text: "The page navigation stays available on small screens. It was hidden below 860px, which left the overview — the one page with no sidebar — with no way to reach the rest of the documentation"
      audience: public
    - text: "Unknown addresses now return a proper 404: a documented page with links to the reference in a browser, and the usual {\"error\": \"not found\"} envelope for paths under /v1 and /billing, so a mistyped endpoint is handled by a caller's existing error path"
      audience: public
    - text: "Documented the tighter domain cap that applies when subdomains is requested — 1 / 3 / 5 rather than 1 / 5 / 20. It has been enforced since v0.44.0 but appeared in no documentation, so the 400 it returns was unpredictable from the docs. Superseded in v0.73.0: with Basic removed, the cap is 1 on Free and 5 on Pro"
      audience: public
    - text: "Corrected the caching summary on the overview, which still described IP results as one cached document with a single top-level cache_hit. IP lookups have been cached individually, with per-lookup cache_hit, since v0.60.0"
      audience: public
    - text: "Added request and response examples for /v1/usage and /v1/keys/rotate on the overview. Both were listed in a table with no example of either side"
      audience: public
    - text: "Added cache_misses to the UsageSummary schema in the OpenAPI specification, where it was missing from a response the API has been returning"
      audience: public
    - text: "Root causes of the mobile breakage: `width: 100%` on a table is a floor, not a ceiling, so tables whose columns could not fit widened the document; `grid-template-columns: 1fr` on the collapsed hero floors the track at the widest item's min-content, which the hero card then clipped, cutting copy off mid-sentence"
      audience: internal
    - text: "The 404 deliberately does not echo the requested path. Reflecting caller-chosen text onto our own domain is a phishing primitive, and a 404 has no need to repeat an address the reader just typed. A test asserts it"
      audience: internal
    - text: "Guards added in internal/handler/docs_layout_test.go: every table must be wrapped in .table-scroll, the mobile CSS guards must stay present, and the topbar nav must link to all four pages. All of these failures are invisible at a desktop viewport, which is why they survived review"
      audience: internal

- version: v0.67.0
  date: 2026-07-31
  changes:
    - text: "The smoke suite and dev reset are out of sactl; scripts/smoke-test.sh and scripts/docker-reset.sh are the single source of truth again. Having both meant two implementations of the same checks that could pass and fail independently, and the CLI version defaulted --host to production — a 'local' run after a docker reset was actually hitting production's warm cache, which made the reset look broken"
      audience: internal
    - text: "The good parts of the Go suite were ported into the scripts rather than lost: smoke-test.sh now pools free-plan keys (SMOKE_FREE_KEYS or numbered SMOKE_FREE_KEY_N siblings, rotated round-robin) and gained the rate-limit enforcement check using the reserved SMOKE_RATELIMIT_KEY — skipped, not run wrongly, when no key is reserved. docker-reset.sh bounds its readiness wait (RESET_TIMEOUT, default 300s) and names the dependency that timed out instead of hanging forever"
      audience: internal

- version: v0.66.0
  date: 2026-07-31
  changes:
    - text: "Domains with no certificates now return an empty subdomains and ct_logs result instead of an error. The certificate transparency source answers 404 for a name it holds no certificates for, and that was being reported as a lookup failure. A freshly registered typosquat domain usually has no certificates yet, so the domains a customer is most likely to be triaging returned an error instead of the correct answer: none found"
      audience: public
    - text: "Transient certificate transparency failures are retried once before being reported, so a single 404 or 5xx from an unhealthy upstream no longer fails the lookup outright"
      audience: public
    - text: "Retry semantics, shared by both lookups via fetchCrtSh: a 404 or 5xx is retried once after a short pause; two 404s are treated as genuine absence, because crt.sh 404s names it does hold certificates for when unhealthy, and concluding no-certificates from a single 404 would hand a security tool a wrong answer that looks authoritative. A 404 followed by a 5xx stays an error. 429 is never retried — repeating a rate-limited request makes it worse — and timeouts are not retried because a second full timeout would consume the rest of the request budget"
      audience: internal
    - text: "Observed while diagnosing: three consecutive uncached crt.sh fetches returned a 502 and two timeouts. Successes cache for 24h and failures are never cached, so this surfaced as smoke runs that fail on a cold cache and pass on the retry — reading as flaky tooling rather than a flaky upstream"
      audience: internal

- version: v0.65.0
  date: 2026-07-31
  changes:
    - text: "Screenshots should start working again on small deployments. Captures were failing with a browser startup timeout, and because a failed lookup returns 200 with the reason in the errors array rather than an HTTP error, the failure was easy to miss entirely (superseded in v0.75.0: captures stayed unreliable and the screenshot lookup was removed)"
      audience: public
    - text: "screenshot.timeout default raised from 15s to 45s. A cold Chromium on a small shared-CPU machine regularly needs longer than 15s just to announce its DevTools endpoint, so captures were failing before the browser had finished starting"
      audience: internal
    - text: "screenshot.max_concurrent default lowered from 4 to 1. Each in-process browser wants roughly half a gigabyte, so four could exhaust a machine sized for the API and take the whole process down. That was masked only because captures were dying during startup; raising the timeout without this would have turned a broken feature into an outage"
      audience: internal
    - text: "Chromium now runs with --disable-dev-shm-usage and a set of flags trimming work a one-shot capture never benefits from. Containers get a 64MB /dev/shm by default and Chromium assumes far more, which surfaces as a startup timeout rather than as anything mentioning shared memory"
      audience: internal
    - text: "Screenshot capture moved behind domain.ScreenshotProvider (Name, Capture), selected by screenshot.provider and defaulting to chromium. An unrecognized name fails startup rather than silently falling back, since that would start a browser on a machine provisioned on the assumption it would not. Screenshots are the only lookup needing a browser, and in-process capture caps concurrency at about one browser per 500MB — bulk capture is not reachable by buying a larger instance, so a hosted provider needs to be a wiring change"
      audience: internal
    - text: "sactl gained `dev reset`, porting scripts/docker-reset.sh. It lives in its own dev group because every other command in the binary normally points at production, and it bounds the readiness wait — the shell version looped forever, so a container that never came up left the terminal hanging with no indication of which dependency was stuck"
      audience: internal
    - text: "sactl can switch between the production and local environments from inside the interactive menu. Host, database and credentials move together, because pointing only the host at localhost while credentials still came from .env produced 401s that read as a broken deployment. Local needs no .env at all — it uses the plaintext keys from migrations/seed.sql, and a test reads that file so the two cannot drift"
      audience: internal
    - text: "seed.sql gained two more free-plan keys so a local smoke run has a rotation pool plus one key reserved for the rate limit check, matching production. With a single free key the run spends minutes waiting out the 5/minute limit"
      audience: internal
    - text: "Three singleflight tests released the blocked fetch as soon as the first one started, rather than once every caller had arrived. The first fetch then completed and its entry was deleted before the stragglers reached it, so they each started a fetch of their own — a flake whose count varied with scheduling and which failed CI"
      audience: internal
    - text: "sactl gained `lookup domain` and `lookup ip`, which go through the HTTP API exactly as a customer request would. The CLI imports internal/domain only for lookup name constants, never to execute one, so what it prints is what the deployed service returns"
      audience: internal
    - text: "Commands that change deployed state now require a global --allow-writes flag. Read-only inspection is the common case, often against production and often in a hurry, and the mutating commands sit one word from the read-only ones (customer list vs customer plan). The gate is drawn at what a command can reach rather than at how destructive it is: dev reset wipes volumes and is ungated, since it cannot touch a deployed database and gating it would train the habit of passing the flag routinely"
      audience: internal
    - text: "TestConfig_Defaults asserted against the process-wide Viper, which merges in any config file on the search path. On a host carrying /etc/security-accelerated/intelligence-api.yaml it therefore tested the machine's configuration rather than the defaults, and a changed default read back as its old value locally while failing in CI. Defaults are now built into a fresh Viper by setDefaults"
      audience: internal

- version: v0.64.0
  date: 2026-07-31
  changes:
    - text: "Release notes have moved to their own page at /docs/changelog, linked from the top nav of every docs page. They previously ran down the bottom of both the overview and the domain reference, which put a list that only grows on two pages people open to look something up"
      audience: public
    - text: "The full response example is now the last section on both reference pages, immediately before the end, rather than sitting between the field docs and Caching"
      audience: public
    - text: "Fixed the overview page footer. The panel declared a three-column grid and the markup had grown to four children, so the support address wrapped onto a second row and sat under the copyright with an alignment meant for a column it was no longer in. It is now two flex groups — identity left, links right — which cannot break when a link is added or removed"
      audience: internal
    - text: "The IP page sidebar listed Example before Validation while the page had them the other way round, so working down the nav jumped backwards through the document"
      audience: internal
    - text: "TestDocs_SidebarMatchesDocumentOrder checks every reference sidebar for links pointing at anchors no heading defines, and for entries listed out of document order. Both are invisible on the rendered page unless you happen to click the wrong link, and moving a section is exactly when they happen"
      audience: internal
    - text: "Page-wide docs tests now iterate a shared list of pages rather than hardcoding paths, so a new page cannot quietly opt out of the CSP, inline-script, footer, or OpenAPI-link assertions. The changelog page was picked up by all of them on the first run"
      audience: internal
    - text: "The internal-audience filter is now asserted on every docs page rather than only the one rendering the list, since that filter is the only thing keeping internal notes off a public page"
      audience: internal
    - text: "POSTGRES_URL is now accepted as a complete connection string and takes precedence over the individual POSTGRES_* settings. Managed providers issue one URL, and splitting it into host/user/password/dbname to reassemble it drops any parameters carried in the query string — endpoint IDs, channel binding, pooler options — which surfaces as an authentication failure rather than as missing configuration"
      audience: internal

- version: v0.63.0
  date: 2026-07-31
  changes:
    - text: "The domain and IP docs pages now show the headers returned with a lookup, not just the JSON body. The full response example gained a Response Headers section covering X-Request-ID, the echoed X-Client-Request-ID, and the rate limit pair"
      audience: public
    - text: "CORRECTION: the IP docs page said X-Client-Request-ID accepted \"any string up to 128 chars\". The real limit is 64 characters, restricted to letters, digits, hyphens, underscores, dots, and colons. An ID that fails validation is ignored rather than rejected, so anyone following the old text would have sent a longer ID, received 200, and silently lost their tracing with nothing to explain it. Both pages now state the enforced rule and call out the silent-drop behaviour"
      audience: public
    - text: "The OpenAPI spec documented no response headers at all and never mentioned X-Client-Request-ID, so generated clients had no idea either existed. Added components.parameters.ClientRequestID and components.headers, wired into every 200 and the shared 429 response across all four documented endpoints"
      audience: public
    - text: "Both docs pages claimed \"every response includes rate limit headers\", which is not true for every request path. Reworded to describe what the headers report without asserting they are universal"
      audience: internal
    - text: "clientRequestIDMaxLen is now exported as middleware.ClientRequestIDMaxLen, since the docs pages and the OpenAPI spec both publish the number"
      audience: internal
    - text: "TestDocs_ResponseHeadersDocumented asserts both pages name every observable response header and state the limit derived from the middleware constant. TestOpenAPIMatchesCorrelationIDContract runs candidate IDs through both the spec's regex and the real middleware and requires the same verdict, rather than comparing the two patterns as strings. Both were confirmed to fail against the old wrong values"
      audience: internal
    - text: "Docs detail pages gained the OpenAPI spec link in the footer and sidebar nav, so the machine-readable contract is reachable from the reference pages rather than only the overview"
      audience: internal
    - text: "Correlation headers are documented on error responses too, not only on 200. Review flagged the 429; checking the middleware chain showed it applies to every error, since ClientRequestID and RequestLogger write their headers before anything downstream can abort. All five shared error responses now declare them, so a caller reading the spec no longer concludes their correlation ID is dropped on exactly the responses they most need to trace"
      audience: internal
    - text: "The X-RateLimit pair is deliberately not declared on the shared error responses: the limiter runs after authentication and returns early without an API key in context, so a 401 never reaches it"
      audience: internal
    - text: "Two more tests: TestOpenAPIDeclaresCorrelationHeadersOnEveryResponse walks every documented response in the spec, and TestClientRequestID_SurvivesAbortedResponses asserts the middleware actually emits both headers across 400/401/403/429/500. Together they check the claim from both sides rather than trusting the chain order to stay put"
      audience: internal

- version: v0.62.0
  date: 2026-07-31
  changes:
    - text: "Screenshot lookups now honour their configured timeout when the browser is slow to start, instead of overrunning it. On a loaded host a capture could hold a browser slot well past its deadline, delaying other screenshot requests queued behind it"
      audience: public
    - text: "chromedp caps the wait for Chrome to announce its DevTools URL at a fixed 20s and watches only its own timer, never the context. With screenshot.timeout defaulting to 15s that wall sat outside our budget entirely: a slow launch overran the deadline by up to 20s while holding one of screenshot.max_concurrent slots, and a longer budget could not buy a cold machine more startup time"
      audience: internal
    - text: "captureScreenshot now passes chromedp.WSURLReadTimeout derived from whatever remains of the caller's deadline, making the screenshot timeout the single authority over a capture's length. An already-spent budget yields a non-positive duration, which fails immediately rather than waiting 20s to report a certainty"
      audience: internal
    - text: "Found via a CI flake: the headless-Chrome SSRF regression test failed at exactly 20.04s on a cold runner. Chrome had not crashed — chromedp reports that case differently — it was simply slower to launch than the fixed wall allowed. The test's own budget is now well clear of the slowest plausible start, since a browser that fails to launch proves nothing about containment and only costs a red build"
      audience: internal

- version: v0.61.0
  date: 2026-07-31
  changes:
    - text: "Lookups no longer report an upstream failure as an absent record. A threat intelligence provider that could not be reached, a BGP lookup whose queries all failed, an unreadable certificate transparency response, or email security records that could not be resolved are now reported as errors rather than as clean, empty results"
      audience: public
    - text: "This matters most for threat intelligence: a rate-limited provider used to return \"not detected\", which scoring counted at its full weight, so a domain nobody checked scored the same as a domain checked and found clean"
      audience: public
    - text: "VirusTotal and the three IP adapters used limiter.Allow() and returned a synthetic clean result; they now use limiter.Wait(ctx) and return an error, matching URLhaus and AlienVault. The coordinator already excludes errored providers from scoring"
      audience: internal
    - text: "Partial results are no longer cached. multiErrRunner returns data alongside per-provider errors and only the payload was stored, so a cache hit replayed a partial result as a complete, error-free success with no retry until the TTL expired"
      audience: internal
    - text: "LookupBGP returns an error when every Cymru origin lookup fails instead of an empty record set cached for 24 hours"
      audience: internal
    - text: "LookupEmailSecurity distinguishes NXDOMAIN/NODATA from timeouts and SERVFAIL via isDNSAbsence. A domain that publishes no SPF or DMARC is still a successful empty answer; a domain whose lookups could not complete is an error"
      audience: internal
    - text: "parseCrtShResponse returns an error on malformed JSON rather than nil. Because the body is read through io.LimitReader, an oversized response arrives truncated mid-structure and took the same silent path"
      audience: internal
    - text: "DNSSEC no longer uses a truncated UDP response when the TCP retry fails — it moves to the next resolver, since incomplete answers would report DNSKEY or CAA records as missing when they exist"
      audience: internal
    - text: "Two service tests asserted the old caching behaviour and were rewritten; the external review noted they blessed the defect"
      audience: internal

- version: v0.60.0
  date: 2026-07-30
  changes:
    - text: "SECURITY: fixed an SSRF weakness in the screenshot lookup. Headless Chrome could reach loopback and link-local addresses directly, so a page that passed the pre-flight safety check could redirect the browser to an internal service or cloud metadata endpoint and have it captured"
      audience: public
    - text: "Chromium bypasses the configured proxy for loopback and link-local addresses by default, so chromedp.ProxyServer alone never contained it — safenet saw none of that traffic. Added --proxy-bypass-list=<-loopback>, which removes the implicit bypass"
      audience: internal
    - text: "Reproduced before fixing: a Chrome capture aimed at a loopback HTTP server delivered 2 requests to it. After the fix, zero. The regression test asserts the capture ran to completion before asserting containment, so a browser that fails to launch fails the test rather than passing it"
      audience: internal
    - text: "captureScreenshot had no test coverage at all; it now has a real headless-Chrome regression test"
      audience: internal
    - text: "CI now runs the full test suite before publishing an image or deploying. docker.yml and fly-deploy.yml built and shipped without running anything, so a failing test could reach production unnoticed"
      audience: internal
    - text: "test.yml is a reusable workflow (workflow_call) invoked by both pipelines through needs:, and runs directly on pull requests. It checks gofmt, go mod tidy -diff, go vet, build, unit tests with -race, and the tagged integration suite"
      audience: internal
    - text: "No push trigger on test.yml: pushes to main run docker.yml and pushes to release run fly-deploy.yml, both of which call it, so a push trigger would run the whole suite twice"
      audience: internal
    - text: "actionlint runs as the first CI step, since a typo in needs: would leave the gate silently not gating. Verified it catches exactly that"
      audience: internal
    - text: "The CI gate provisions Chrome and sets REQUIRE_CHROME so the screenshot SSRF regression test cannot silently skip — a skipped test looks identical to a passing one in the run summary. A shell step is used rather than a third-party setup action, since this job holds a repository token"
      audience: internal
    - text: "Checkouts no longer persist GITHUB_TOKEN, jobs declare contents: read, and actionlint is pinned to a commit SHA verified through the GitHub API"
      audience: internal

- version: v0.59.0
  date: 2026-07-30
  changes:
    - text: "Fixed a bug where the service could lose its database connection after a few minutes of uptime"
      audience: public
    - text: "InitResolver no longer overrides net.DefaultResolver. It sets a resolver scoped to the domain package, returned by domain.Resolver(), which the 11 lookup call sites now use explicitly"
      audience: internal
    - text: "Overriding the global sent every resolution in the process to public DNS, including the service's own infrastructure connections. app.go called InitResolver after Postgres and Redis connected, but that only protected the initial connections: database/sql recycles on conn_max_lifetime (5m) and conn_max_idle_time (2m), and every replacement failed with 'no such host'. Production was unaffected because Neon and Upstash are public hostnames; local dev broke minutes after every start, and Kubernetes service DNS or Fly .internal addresses would have broken immediately"
      audience: internal
    - text: "The startup-ordering constraint in app.go is gone with it — InitResolver can now run at any point, since nothing outside the domain package changes how it resolves names"
      audience: internal
    - text: "TestInitResolver_SetsDefaultServers now asserts net.DefaultResolver.Dial stays nil, so reinstating the global override fails the build"
      audience: internal

- version: v0.58.0
  date: 2026-07-30
  changes:
    - text: "Docker Compose now passes MAXMIND_LICENSE_KEY through from .env, so local dev downloads and persists the GeoIP databases to ./data/maxmind the same way production does. Previously geo and asn were permanently unavailable locally"
      audience: internal
    - text: "The smoke test asks /v1/health about GeoIP before the geo/asn content checks and reports the cause, rather than emitting opaque 'jq filter failed' lines. Still a failure, not a warning — geo being unavailable is a real problem wherever it runs"
      audience: internal
    - text: "The OpenAPI spec at /docs/openapi.yaml was still describing the pre-v0.54.0 request contract — per-feature booleans instead of the `lookups` array, a bare array response instead of the `results` envelope, and a top-level `cache_hit`. Anyone generating a client from it would have built requests that fail validation. It now matches the live API"
      audience: public
    - text: "The domain docs page listed `dns_security` as an optional boolean request field alongside `lookups`. That row is gone; dns_security is a lookup name, as the Valid Lookups table already showed"
      audience: public
    - text: "OpenAPI now documents `lookups` with an enum of valid names on both endpoints, both request fields as required, the results envelope, per-lookup cache_hit on all 18 lookup schemas, and the `inputs` array on responses"
      audience: internal
    - text: "TestOpenAPIMatchesLookupContract compares the spec's lookups enum and required fields against domain.AllLookupNames and AllIPLookupNames, so adding a lookup without updating the spec now fails CI"
      audience: internal
    - text: "The sales overview was missing DNSSEC/CAA and the aggregate risk score entirely — two shipped features it never mentioned — and its example request omitted both names. Added sections for each and corrected the example"
      audience: internal
    - text: "api.http gained a risk example; it was the only lookup with no request in the file"
      audience: internal
    - text: "TestDocs_RequestBodyListsOnlyContractFields asserts the docs request-body tables list only the target array and lookups — a per-feature boolean row reappearing fails the build. Grepping could not catch the stale row, since the lookup names legitimately appear all over those pages"
      audience: internal

- version: v0.57.0
  date: 2026-07-30
  changes:
    - text: "GeoIP databases now load themselves at startup and persist across restarts. `geo` and `asn` were unavailable after most restarts because the databases had to be bootstrapped by hand; they are now persisted and downloaded automatically on boot when missing or out of date"
      audience: public
    - text: "The download runs in a background goroutine rather than blocking startup — it is around 80MB, and blocking would delay the listener past the platform health check on every cold start. geo and asn report that they are unavailable for the first few seconds instead"
      audience: internal
    - text: "New maxmind.max_age (default 168h) re-downloads databases older than that at startup; MaxMind publishes GeoLite2 updates twice a week. 0 disables the check. A stale database is loaded first and refreshed behind it"
      audience: internal
    - text: "A database that exists but cannot be opened — a truncated download from a killed machine — is now treated as absent and re-downloaded rather than leaving an empty reader in place"
      audience: internal
    - text: "planGeoIP isolates the load/download decision from the download itself, so the startup behaviour is covered by tests that need no network"
      audience: internal
    - text: "Added a maxmind_data volume mounted at /data/maxmind. Machine filesystems are recreated from the image on every start, so without it the databases are re-downloaded on every cold start"
      audience: internal
    - text: "Fly requires one volume per machine — two volumes for two machines, provisioned in separate zones"
      audience: internal
    - text: "Volumes mount root-owned with no uid/gid option, so docker-entrypoint.sh chowns the mount as root and execs the app as appuser via su-exec. The Dockerfile no longer sets USER; the application still runs unprivileged. An unwritable mount warns loudly and keeps serving rather than crash-looping the machine over one degraded lookup"
      audience: internal

- version: v0.56.0
  date: 2026-07-30
  changes:
    - text: "DNS lookups now fail over correctly. Failover never triggered over UDP, so a lookup could stall on an unresponsive resolver instead of moving to the next one; a resolver that cannot be reached at all is now skipped as well"
      audience: public
    - text: "The Go code examples on the docs pages declared the same variable twice and did not compile. The JavaScript, Python and Go examples on the IP page were also still on the pre-v0.55.0 request contract"
      audience: public
    - text: "A target that rejects the TLS handshake is reported as a finding about that target rather than as an internal error"
      audience: public
    - text: "failoverConn retries the pending query against the next server when one goes silent, since UDP dials succeed for any routable address and a dial-time loop always selects the first server. Dial errors cascade too, for the unroutable case"
      audience: internal
    - text: "Lookup error classification keys on types and sentinels (errors.Is/errors.As) instead of substring matches on message text, so a dependency rewording an error no longer silently changes what pages someone"
      audience: internal
    - text: "Remote TLS alerts arrive as *net.OpError{Op: \"remote error\"} with an unexported alert type, so the tls.AlertError check never matched a real handshake failure; both shapes are now classified"
      audience: internal
    - text: "The test suite no longer touches the network — DNS tests run against a local miekg/dns server and TLS classification against a loopback listener, so the suite passes with no egress at all"
      audience: internal
    - text: "TestDocs_GoExamplesCompile builds each page's Go example rather than string-matching it; the smoke test's crt.sh assertion no longer downgrades failures from our own API to warnings"
      audience: internal

- version: v0.55.0
  date: 2026-07-30
  changes:
    - text: "BREAKING: IP lookups now take the same `lookups` array as domain lookups. The `threat_intel` boolean is gone; valid names are geo, asn, reverse_dns, abuse_contact and threat_intel"
      audience: public
    - text: "BREAKING: IP responses are wrapped in a `results` envelope and the top-level `cache_hit` is replaced by a per-lookup `cache_hit`, matching the domain endpoint"
      audience: public
    - text: "IP results now report the canonicalized `ip` plus an `inputs` array of the original entries that mapped to it. Addresses that canonicalize to the same value are deduplicated, so 2001:DB8::1 and 2001:db8:0:0:0:0:0:1 return one result"
      audience: public
    - text: "IP lookups are cached individually with their own TTLs — 24h for abuse_contact, 6h for reverse_dns, 30m for threat_intel — so a slow RDAP lookup no longer shortens everything else's cache lifetime"
      audience: public
    - text: "geo and asn are no longer cached at all. They read a local database with no network call, so recomputing them is faster than a cache round trip; their cache_hit is always false"
      audience: public
    - text: "Requesting a domain-only lookup name (such as whois) on the IP endpoint now returns 400 rather than being silently ignored"
      audience: public
    - text: "IP cache keys use a separate `ip:<ip>:<lookup>` namespace, so threat_intel on the two endpoints cannot collide"
      audience: internal
    - text: "Extracted the per-lookup runner machinery into service/runner.go, shared by both services; service/whole_response.go and its copyViaJSON/goLookup helpers are deleted with no remaining callers"
      audience: internal
    - text: "Negative caching removed from the IP service too, and redis.negative_cache_ttl deleted — per-lookup keys made it unnecessary on both endpoints"
      audience: internal
    - text: "A missing GeoIP database is now classified as an expected error rather than special-cased in the IP service, so it still does not trigger alerts"
      audience: internal
    - text: "request_log gains geo/asn/reverse_dns/abuse_contact columns (migration 015)"
      audience: internal

- version: v0.54.0
  date: 2026-07-30
  changes:
    - text: "BREAKING: domain lookups now require a `lookups` array naming exactly which lookups to run. The per-feature booleans (screenshot, reputation, email_security, subdomains, ct_logs, bgp, fingerprint, threat_intel) are gone, and whois/dns/ssl/headers are no longer implicit — nothing runs unless you ask for it"
      audience: public
    - text: "BREAKING: lookup responses are now wrapped in a `results` envelope instead of a bare JSON array, so every response is a JSON object"
      audience: public
    - text: "BREAKING: the top-level `cache_hit` field is gone. Each lookup object now carries its own `cache_hit`, since lookups are cached independently"
      audience: public
    - text: "Each result now reports the normalized `domain` plus an `inputs` array listing the original request entries that mapped to it. Match results by `domain` — array position is not part of the contract"
      audience: public
    - text: "Domains that normalize to the same name are deduplicated into a single result. Plan domain limits still count the entries you submit"
      audience: public
    - text: "Lookup names and domains are trimmed, lowercased, and deduplicated before validation, so `[\" SSL \", \"ssl\"]` and `Example.COM` behave as expected"
      audience: public
    - text: "Results are now cached per lookup rather than per response, each with its own TTL — 30 minutes for dns/headers/reputation/threat_intel, 4 hours for ssl/email_security, 24 hours for whois/ct_logs/subdomains/bgp, 60 minutes for screenshot. A lookup you fetched yesterday is reusable today regardless of what else you request alongside it"
      audience: public
    - text: "Requesting headers and fingerprint together now costs a single headers fetch. Fingerprint has no cache entry of its own, so fingerprint rule updates take effect immediately"
      audience: public
    - text: "New 400 responses for a missing/empty `lookups` array and for unrecognized lookup names; requesting a lookup outside your plan returns 403 naming that lookup"
      audience: public
    - text: "`dns_security` (DNSSEC + CAA) is now selected like any other lookup rather than via its own flag"
      audience: public
    - text: "BREAKING: the aggregate `risk` score is now opt-in. Add \"risk\" to `lookups` to get it — it still costs no extra network call and scores over whatever else you requested"
      audience: public
    - text: "Domain lookups no longer cache failures. Per-lookup TTLs mean one flaky provider can no longer shorten every other lookup's cache lifetime, and a failing lookup is retried rather than remembered. IP lookups still negative-cache, since they are cached as a single document (superseded in v0.55.0: IP lookups no longer cache failures either)"
      audience: public
    - text: "Cache keys are now flat `lookup:<domain>:<name>` entries; the composite sorted-suffix key builder has been removed"
      audience: internal
    - text: "service.Lookup() issues a single MGET for all requested lookups and spawns goroutines only for the misses; each goroutine writes its own result with that lookup's TTL"
      audience: internal
    - text: "Cache failures are fail-open throughout — read errors and corrupt entries degrade to live lookups (overwriting the bad entry), and failed writes are logged without affecting the response"
      audience: internal
    - text: "Replaced redis.cache_ttl with cache.default_ttl plus per-lookup cache.ttl.* keys; env overrides work per Viper convention (CACHE_TTL_WHOIS, CACHE_DEFAULT_TTL)"
      audience: internal
    - text: "request_log now records per-lookup cache_hits/cache_misses counts instead of a per-request cache_hit boolean, and tracks the four base lookups alongside the optional ones (migration 012)"
      audience: internal
    - text: "Admin usage endpoint reports cache hit rate from per-lookup counts and includes whois/dns/ssl/headers in feature_usage"
      audience: internal
    - text: "/v1/info cache section now reports default_ttl plus the resolved per-lookup TTL table"
      audience: internal
    - text: "Singleflight coalescing is now keyed per lookup per domain instead of per response, so requests asking for overlapping-but-different lookup sets share the overlap"
      audience: internal
    - text: "Coalesced callers each decode the shared payload into their own response, replacing the copy-via-JSON guard against shared-pointer mutation"
      audience: internal
    - text: "The global Chromium semaphore now lives inside the screenshot lookup runner"
      audience: internal

- version: v0.53.0
  date: 2026-06-12
  changes:
    - text: "Improved reliability under load: heavy lookups are now bounded and isolated so one slow or failing lookup can't affect other requests"
      audience: public
    - text: "Panic recovery in all lookup goroutines — a panicking lookup degrades to a per-lookup error instead of killing the process"
      audience: internal
    - text: "Provisioned API key plaintext is blanked on retrieval and expired rows are swept on an interval (billing.cleanup_interval, default 10m)"
      audience: internal
    - text: "Global semaphore caps concurrent Chromium screenshots (screenshot.max_concurrent, default 4)"
      audience: internal
    - text: "crt.sh requests (subdomains, CT logs) now have end-to-end HTTP timeouts (subdomain.http_timeout / ct_logs.http_timeout, default 15s)"
      audience: internal
    - text: "safenet blocks TEST-NET, benchmarking, 240/4, 0/8, 192.0.0.0/24, and IPv6 documentation ranges; IPv4-mapped IPv6 unmapped before checks; migrated to netip.Addr"
      audience: internal
    - text: "Singleflight copy failures return an isolated error response instead of a shared pointer (CodeRabbit finding)"
      audience: internal

- version: v0.52.0
  date: 2026-06-11
  changes:
    - text: "Every domain lookup now includes an aggregate risk score (0–100 with risk level and per-component breakdown) computed from all returned data (superseded in v0.54.0: the risk score is opt-in; add \"risk\" to `lookups`)"
      audience: public
    - text: "New dns_security option — DNSSEC deployment (DS/DNSKEY, signing algorithms) and CAA records, available on all plans"
      audience: public
    - text: "email_security now also checks MTA-STS (including the published policy), TLS-RPT, and BIMI"
      audience: public
    - text: "New GET /v1/usage — view your own request counts, cache hit rate, and feature usage"
      audience: public
    - text: "New POST /v1/keys/rotate — self-service API key rotation; old keys keep working for a 24h grace window"
      audience: public
    - text: "Machine-readable OpenAPI 3.1 spec now served at /docs/openapi.yaml"
      audience: public
    - text: "All responses now include Strict-Transport-Security, Referrer-Policy, and Content-Security-Policy headers"
      audience: public
    - text: "Failed lookups are now retried sooner: error responses cache for a short negative TTL instead of the full cache window (superseded in v0.54.0 and v0.55.0: failures are no longer cached at all)"
      audience: public
    - text: "Removed all inline JavaScript from docs and checkout pages; scripts are now served as external files under a strict page CSP"
      audience: internal
    - text: "Concurrent identical lookups now coalesce via singleflight; lookups detached from client cancellation"
      audience: internal
    - text: "New unauthenticated /v1/health endpoint (Postgres/Redis/GeoIP state); uptime monitoring now hits it instead of /v1/hello"
      audience: internal
    - text: "Migrations 012 (api_keys.expires_at, multi-key rotation) and 013 (request_log.dns_security) — already applied to Neon"
      audience: internal

- version: v0.51.0
  date: 2026-04-16
  changes:
    - text: "Subdomain enumeration is now subject to a tighter per-plan domain cap"
      audience: public
    - text: "MaxMind license key is now redacted from any wrapped error originating from the database download client"
      audience: internal
    - text: "Replaced time.Sleep-based test synchronization in billing and notification tests with channel-driven waits"
