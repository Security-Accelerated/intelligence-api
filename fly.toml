# fly.toml app configuration file generated for security-accelerated-intelligence-api on 2026-03-10T22:37:58-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'security-accelerated-intelligence-api'
primary_region = 'iad'

[build]

# Non-secret display values. The Stripe price ID itself is a secret; this is the
# text the docs Plans table shows and must change together with that price.
[env]
  STRIPE_PRICE_DISPLAY_PRO = '$29/month'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # One machine stays warm. With zero, every request after ten idle minutes
  # paid a cold start — VM boot, GeoIP open, Neon and Upstash connects — and
  # the five-minute uptime ping occasionally lost that race and reported the
  # service down when it was only waking up. The second machine still stops
  # when idle and starts under load.
  min_machines_running = 1
  processes = ['app']

# Persists the GeoIP database across restarts. Machine filesystems are a blank
# slate on every start, so without this the database is re-downloaded on each
# cold start. One volume per machine is required by Fly; both are named
# maxmind_data and each machine attaches one. The name predates the move to
# DB-IP and stays because Fly volumes cannot be renamed.
[mounts]
  source = 'maxmind_data'
  destination = '/data/geoip'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  # Sized for in-process headless Chromium, which wanted about half a gigabyte
  # per capture. Screenshots were removed before v1.0 (#110), so 512 MB may be
  # enough now; measure before shrinking it.
  memory_mb = 1024
