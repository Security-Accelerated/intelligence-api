# fly.toml app configuration file generated for security-accelerated-intelligence-api on 2026-03-10T22:37:58-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'security-accelerated-intelligence-api'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # One machine stays warm. With zero, every request after ten idle minutes
  # paid a cold start — VM boot, GeoIP open, Neon and Upstash connects — and
  # the five-minute uptime ping occasionally lost that race and reported the
  # service down when it was only waking up. The second machine still stops
  # when idle and starts under load.
  min_machines_running = 1
  processes = ['app']

# Persists the MaxMind GeoIP databases across restarts. Machine filesystems are
# a blank slate on every start, so without this the databases are re-downloaded
# on each cold start. One volume per machine is required by Fly; both are named
# maxmind_data and each machine attaches one.
[mounts]
  source = 'maxmind_data'
  destination = '/data/maxmind'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  # Headless Chromium wants roughly half a gigabyte per capture. At 512 the
  # process was one screenshot away from the memory ceiling, which is why
  # screenshot.max_concurrent defaults to 1. 1 GB gives that lookup room
  # without changing the cap.
  memory_mb = 1024
